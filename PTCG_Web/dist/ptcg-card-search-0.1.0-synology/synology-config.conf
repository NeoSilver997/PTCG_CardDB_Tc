# PTCG Card Search - Synology Package Configuration
# This file contains configuration for Synology NAS deployment

# Package Information
PACKAGE_NAME="PTCGCardSearch"
PACKAGE_VERSION="0.1.0"
PACKAGE_AUTHOR="NeoSilver997"
PACKAGE_MAINTAINER="NeoSilver997"
PACKAGE_DESCRIPTION="Pokemon TCG Card Search and Inventory Management System"

# System Requirements
REQUIRED_NODE_VERSION="20.0.0"
MIN_DISK_SPACE="500MB"
RECOMMENDED_MEMORY="512MB"

# Network Configuration
DEFAULT_PORT=3000
PROTOCOL="http"

# Data Directories (relative to package installation)
DATA_DIR="data"
CARDS_DIR="cards"
LOGS_DIR="logs"

# Service Configuration
SERVICE_NAME="ptcg-card-search"
SERVICE_USER="ptcg"
SERVICE_GROUP="ptcg"

# Auto-start configuration
AUTO_START=true
START_ON_BOOT=true

# Backup configuration
BACKUP_DATA=true
BACKUP_SCHEDULE="daily"

# Log rotation
LOG_ROTATION="weekly"
LOG_RETENTION="4"